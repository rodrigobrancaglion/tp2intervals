<div class="login-container">
  <div class="login-glow"></div>
  
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo"
           [style.background-image]="'url(assets/platforms/tp2intervals.png)'"
           [style.background-size]="'cover'"
           [style.background-position]="'center'">
      </div>
      <h1 class="login-title">TP2Intervals</h1>
      <p class="login-subtitle">{{ isRegisterMode ? 'Create your account' : 'Sign in to continue' }}</p>
    </div>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input id="username"
                 formControlName="username"
                 class="form-input"
                 placeholder="Enter your username"
                 autocomplete="username">
        </div>
        <span class="form-error" *ngIf="authForm.get('username')?.touched && authForm.get('username')?.hasError('required')">
          Username is required
        </span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input id="password"
                 formControlName="password"
                 type="password"
                 class="form-input"
                 placeholder="Enter your password"
                 autocomplete="current-password">
        </div>
        <span class="form-error" *ngIf="authForm.get('password')?.touched && authForm.get('password')?.hasError('required')">
          Password is required
        </span>
      </div>

      <div class="form-group" *ngIf="isRegisterMode">
        <label class="form-label" for="email">Email <span class="optional-tag">(optional)</span></label>
        <div class="input-wrapper">
          <i class="bi bi-envelope input-icon"></i>
          <input id="email"
                 formControlName="email"
                 type="email"
                 class="form-input"
                 placeholder="Enter your email">
        </div>
      </div>

      <button type="submit"
              class="login-btn"
              [disabled]="!authForm.valid || isLoading"
              [class.loading]="isLoading">
        <span *ngIf="!isLoading">{{ isRegisterMode ? 'Create Account' : 'Sign In' }}</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <div class="login-footer">
      <a href="javascript:void(0)" (click)="toggleMode()" class="toggle-link">
        {{ isRegisterMode ? 'Already have an account? Sign in' : 'Don\'t have an account? Register' }}
      </a>
    </div>
  </div>
</div>
