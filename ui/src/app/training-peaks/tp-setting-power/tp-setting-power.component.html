<div class="setting-container">
  <p>Synchronize your Power Zones from TP to ICU and Wahoo</p>

  <div class="actions">
    <button mat-raised-button color="primary" (click)="confirmSync()" [disabled]="isSyncing">
      {{ isSyncing ? 'Syncing...' : 'Confirm' }}
    </button>

    <mat-checkbox [(ngModel)]="schedulerEnabled" (change)="onSchedulerToggle()" class="scheduler-checkbox">
      Scheduler (Every Monday)
    </mat-checkbox>
  </div>
</div>
