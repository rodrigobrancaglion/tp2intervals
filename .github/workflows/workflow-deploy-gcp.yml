name: Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      service-name:
        required: false
        type: string
        default: 'tp2intervals-web'
    secrets:
      GCP_SA_KEY:
        required: true
      GCP_PROJECT_ID:
        required: true

env:
  GCP_REGION: us-central1
  GCP_REPOSITORY: repo-tp2intervals

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Autenticação no Google Cloud
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Configurar Cloud SDK
      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      # 3. Deploy para o Cloud Run
      # Nota: Ele assume que a imagem já foi enviada para o Artifact Registry no passo anterior
      - name: Deploy to Cloud Run
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ inputs.service-name }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/repo-tp2intervals/app:${{ inputs.version }}
          flags: '--allow-unauthenticated --port=8080'


      # 4. Mostrar a URL gerada
      - name: Show Output
        run: echo "App deployed to ${{ steps.deploy.outputs.url }}"