name: Docker Image

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: 'dev'
      jar-name:
        required: true
        type: string
      jar-artifact-name:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: true
    secrets:
      GCP_SA_KEY:
        required: true
      GCP_PROJECT_ID:
        required: true

env:
  GCP_REGION: us-central1
  GCP_REPOSITORY: repo-tp2intervals

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@master
        with:
          name: ${{ inputs.jar-artifact-name }}
          path: artifact

      # Login no Google
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # Configura o Docker para o Google
      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Define a Tag da imagem no padrão do Google
      - name: Extract Docker metadata
        id: meta
        run: |
          echo "tag=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/app:${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.dry-run == false }}
          tags: ${{ steps.meta.outputs.tag }}
          platforms: linux/amd64
          build-args: "JAR_PATH=artifact/${{ inputs.jar-name }}.jar"
          cache-from: type=gha
          cache-to: type=gha,mode=max