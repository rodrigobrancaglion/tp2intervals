name: Docker Image

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: 'dev'
      jar-name:
        required: true
        type: string
      jar-artifact-name:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true



jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@master
        with:
          name: ${{ inputs.jar-artifact-name }}
          path: artifact

      # Login to Docker Hub
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Define Docker Hub image tag
      - name: Extract Docker metadata
        id: meta
        run: |
          echo "tag=${{ secrets.DOCKERHUB_USERNAME }}/tp2intervals:${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.dry-run == false }}
          tags: ${{ steps.meta.outputs.tag }}
          platforms: linux/amd64
          build-args: "JAR_PATH=artifact/${{ inputs.jar-name }}.jar"
          cache-from: type=gha
          cache-to: type=gha,mode=max